name: Agent Trader (autonomous)

# The autonomous Claude-driven paper account. Unlike the wheel/strategy monitors
# (deterministic Python), this runs agent_trader.py, which asks Claude (Opus) to
# make every trading decision on a separate ~$2k paper MARGIN account and places
# the orders it chooses. Full autonomy, defined-risk options + stock, own state
# file and Discord channels. Paper only — does not touch manual or live.
#
# Cadence: EVERY 2 HOURS during market hours (not every 10 min like the wheel
# monitors — a discretionary trader doesn't need that). Halved from hourly on
# 2026-08-19: hourly was ~$100/month in Anthropic credits on a $2k paper
# account, and most cycles end in a hold. See tools/setup_cronjobs.py for the
# fire times and why they were chosen.
#
# Triggered by cron-job.org via workflow_dispatch, exactly like the wheel monitors.
# We originally used GitHub's native `schedule:` (self-scheduling, no cron-job.org
# creds needed — a fit for mobile-only provisioning), but native cron proved
# unreliable here: on 2026-08-14 it skipped fires and ran others 10–49 min late —
# the exact flakiness documented for this repo. Switched to cron-job.org for
# reliable firing. The job is defined in tools/setup_cronjobs.py; it can also be
# created/edited by hand in the cron-job.org web console (works from mobile).
#
# ‼️ There is deliberately NO `schedule:` trigger here. cron-job.org is the ONLY
# scheduler — adding a native `schedule:` back would double-fire the workflow
# (two cycles per slot → duplicate trade attempts), so don't.
#
# ⚠️ DST: the cron-job.org schedule (`7 14,16,18,19 * * 1-5` UTC) covers market
# hours during CDT (Mar–Nov). When DST ends, shift each hour +1, same as the
# other schedules.
#
# Requires (GitHub Actions secrets): ALPACA_AGENT_API_KEY / _API_SECRET /
# _BASE_URL, the four DISCORD_AGENT_*_WEBHOOK values, and ANTHROPIC_API_KEY.

on:
  workflow_dispatch: {}          # cron-job.org calls this; also allows manual trigger

concurrency:
  group: bot-commits
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent trader (Claude decides + places orders)
        env:
          ALPACA_AGENT_API_KEY:          ${{ secrets.ALPACA_AGENT_API_KEY }}
          ALPACA_AGENT_API_SECRET:       ${{ secrets.ALPACA_AGENT_API_SECRET }}
          ALPACA_AGENT_BASE_URL:         ${{ secrets.ALPACA_AGENT_BASE_URL }}
          ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional model override; defaults to claude-opus-5 (agent_config.py).
          AGENT_MODEL:                   ${{ secrets.AGENT_MODEL }}
          DISCORD_AGENT_TRADES_WEBHOOK:  ${{ secrets.DISCORD_AGENT_TRADES_WEBHOOK }}
          DISCORD_AGENT_SUMMARY_WEBHOOK: ${{ secrets.DISCORD_AGENT_SUMMARY_WEBHOOK }}
          DISCORD_AGENT_ERRORS_WEBHOOK:  ${{ secrets.DISCORD_AGENT_ERRORS_WEBHOOK }}
          DISCORD_AGENT_ACTIONS_WEBHOOK: ${{ secrets.DISCORD_AGENT_ACTIONS_WEBHOOK }}
        run: python agent_trader.py

      - name: Push agent state to dashboard
        if: always()
        env:
          BOT_PUSH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}
        run: |
          if [ -f agent_state.json ]; then
            curl -fsS --max-time 10 \
              -X POST https://tradingbot-dashboard-blue.vercel.app/api/bot-state \
              -H "Authorization: Bearer $BOT_PUSH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --slurpfile p agent_state.json \
                         '{key: "bot:agent:state", payload: $p[0]}')" \
              || echo "Dashboard push for agent state failed (non-fatal)"
          else
            echo "agent_state.json not present — skipping dashboard push"
          fi

      - name: Commit state and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_state.json 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state or log changes to commit."
          else
            git commit -m "agent-trader: $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed — rebasing and retrying"
              git pull --rebase origin main
            done
            echo "Push failed after 3 attempts" >&2
            exit 1
          fi
