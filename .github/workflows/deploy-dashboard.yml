name: Deploy Dashboard

# Deploys dashboard/ to Vercel WITHOUT a laptop.
#
# Before this, the only way to ship the dashboard was `npx vercel --prod` from a
# local checkout (Vercel's git integration is not connected to this repo), which
# made every dashboard change laptop-gated. This runs the same deploy from
# GitHub's runners, so it can be triggered from a phone:
#
#   1. Push to `main` touching `dashboard/**`  -> deploys to PRODUCTION.
#   2. Actions tab -> "Deploy Dashboard" -> "Run workflow":
#        - run against `main`        -> deploys to PRODUCTION
#        - run against any other ref -> deploys a PREVIEW (production untouched)
#
# The path filter matters: the bots commit state files + logs/ to `main` every
# 10 minutes. Those are not under `dashboard/`, so bot commits never deploy.
#
# WHY NOT `vercel build` + `--prebuilt`:
# The first version of this workflow built locally and uploaded the artifact, so
# that the exact bits under test were the bits shipped. That cannot work here.
# `dashboard/api/fundamentals.py` pulls yfinance -> pandas -> numpy. Building off
# Vercel, the Python builder cannot resolve wheels for Vercel's runtime, so it
# force-bundles numpy and pandas from source and the function exceeds the 225 MB
# limit ("Total bundle size (276.03 MB)"). On Vercel's own builders the wheels
# resolve and it fits. So we upload source and let Vercel build — byte-for-byte
# the same path as `npx vercel --prod` from a laptop, which has always worked.
# Trade-off: the deployed artifact is built on Vercel rather than being the one
# the tests ran against. The tests still gate whether we deploy this commit at
# all, which is the property that actually matters here.
#
# Requires (GitHub Actions secrets):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#                        ‼️ Scope it to the TEAM ("Tim's projects"), not to a
#                        single project. A project-scoped token has no user
#                        identity, so the CLI's own /v2/user lookup 404s and
#                        every command fails with a misleading
#                        "Could not retrieve Project Settings".
#   VERCEL_ORG_ID      — Vercel -> team settings -> Team ID      (team_…)
#   VERCEL_PROJECT_ID  — Vercel -> tradingbot-dashboard -> Settings (prj_…)
# `.vercel/` is gitignored, so the IDs cannot come from the repo — they must be
# secrets. The dashboard's runtime env vars (ALPACA_*, KV, ANTHROPIC_API_KEY, …)
# stay in Vercel and are applied there at build/run time; nothing moved.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test gate (use only to push an urgent fix)'
        type: boolean
        default: false

# Never let two deploys race. Newer run wins — finishing a deploy of older code
# is not useful.
concurrency:
  group: dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fail early if Vercel secrets are missing
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            echo "See the header comment in .github/workflows/deploy-dashboard.yml." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The point of deploying from a phone is that you cannot run the suite
      # first. This is that check. Skippable via workflow_dispatch for an
      # urgent fix.
      - name: Run tests
        if: inputs.skip_tests != true
        run: npx vitest run --pool=threads

      - name: Typecheck
        if: inputs.skip_tests != true
        run: npx tsc -b

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Uploads source; Vercel builds it. `main` goes to production, every other
      # ref gets a preview deployment so the pipeline can be exercised without
      # touching the live site.
      - name: Deploy
        id: deploy
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            url=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($GITHUB_REF): $url"

      # Renders on the run summary, which is readable in the GitHub mobile app.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Dashboard deploy"
            echo ""
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              if [ "${{ steps.deploy.outputs.target }}" = "production" ]; then
                echo "✅ **Deployed to production**"
                echo ""
                echo "Live: https://tradingbot-dashboard-blue.vercel.app"
                echo ""
                echo "This deployment: ${{ steps.deploy.outputs.url }}"
              else
                echo "🧪 **Preview deployed** (production untouched)"
                echo ""
                echo "Preview: ${{ steps.deploy.outputs.url }}"
              fi
            else
              echo "❌ **Deploy did not complete.** Check the failed step above."
            fi
            echo ""
            echo "Commit: \`${GITHUB_SHA:0:7}\` · Tests: ${{ inputs.skip_tests == true && 'skipped' || 'run' }}"
          } >> "$GITHUB_STEP_SUMMARY"
